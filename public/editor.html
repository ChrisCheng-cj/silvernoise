<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>项目编辑 · Silver Noise</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/editor.css"></head><body class="editor-page">
<header class="editor-header"><a id="back" href="/index.html#work">← 返回作品集</a><strong>SILVER NOISE <span>项目编辑</span></strong><div class="editor-actions"><button id="save" disabled>保存草稿</button><button id="preview" disabled>预览草稿 ↗</button><button id="publish" class="primary" disabled>发布</button></div></header>
<p id="status" class="editor-status" role="status" aria-live="polite">正在验证编辑权限…</p><div id="access" hidden></div>
<main id="editor" hidden><form id="form" class="editor-layout">
<div class="canvas-column"><div class="canvas-heading"><span>作品内容</span><span>点击模块编辑 · 按顺序展示</span></div><article class="editor-canvas"><section id="empty-canvas" hidden><h1>开始构建您的项目：</h1><div class="starter-tools"><button type="button" data-upload="image"><b>▧</b><span>图像 / GIF</span></button><button type="button" data-add-text><b>T</b><span>文本</span></button><button type="button" data-upload="video"><b>▷</b><span>视频</span></button><button type="button" data-cover><b>▣</b><span>顶部封面</span></button></div></section>
<section class="cover-editor"><div id="cover-preview"></div><div class="cover-tools"><label class="upload-button">更换顶部封面<input id="cover-file" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></label><button type="button" id="remove-cover">移除封面</button></div></section>
<section class="intro-editor"><label class="field-label" for="title">项目标题</label><input id="title" class="canvas-title" maxlength="200" required placeholder="为你的作品命名"><div class="fields-two"><label>客户<input id="client" maxlength="100" placeholder="客户名称"></label><label>日期<input id="date" maxlength="100" placeholder="例如 2026 / 11"></label></div><label class="field-label" for="description">项目描述</label><textarea id="description" maxlength="15000" rows="5" placeholder="介绍项目背景、创作想法和你的角色…"></textarea></section>
<div id="media-list"></div><div class="canvas-add"><button type="button" data-add-text>＋ 添加文字</button><button type="button" data-upload="all">＋ 添加图片 / 视频</button></div></article></div>
<aside class="editor-panel"><section><h2>添加内容</h2><div class="module-grid"><button type="button" data-add-text><b>Tt</b>文字</button><button type="button" data-upload="image"><b>▧</b>图片 / GIF</button><button type="button" data-upload="video"><b>▷</b>视频</button><button type="button" id="select-cover"><b>▣</b>顶部封面</button></div><input id="media-files" type="file" multiple accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm" hidden><p class="help">图片、GIF、MP4、WebM，单个文件最多 50 MB。</p></section>
<section id="text-styles"><h2>编辑项目 · 文字样式</h2><p id="selection-label" class="help">选择标题、描述或文字模块</p><div id="style-inspector"></div></section><section><h2>项目设置</h2><button type="button" id="edit-info">编辑标题、客户和日期</button><h2 class="order-heading">内容顺序</h2><p class="help">选中模块后，用上移、下移按钮调整顺序。顶部封面始终通栏展示，正文和媒体居中。</p><p id="module-count" class="help"></p></section></aside>
</form><div id="live-preview" hidden></div></main><script type="module" src="/editor.js"></script></body></html>
