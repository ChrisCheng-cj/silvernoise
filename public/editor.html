<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>项目编辑 · Silver Noise</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/editor.css"></head><body class="editor-page">
<header class="editor-header"><a id="back" href="/index.html#work">← 返回作品集</a><strong>项目编辑</strong><div class="editor-actions"><button id="save" disabled>保存草稿</button><button id="preview" disabled>预览草稿 ↗</button><button id="publish" class="primary" disabled>发布</button></div></header>
<p id="status" class="editor-status" role="status" aria-live="polite">正在验证编辑权限…</p><div id="access" hidden></div>
<main id="editor" class="editor-layout" hidden><form id="form" class="editor-panel">
<section><h2>项目信息</h2><label>项目标题<input id="title" maxlength="200" required></label><div class="fields-two"><label>客户<input id="client" maxlength="100"></label><label>日期<input id="date" maxlength="100" placeholder="例如 2026 / 11"></label></div><label>项目描述<textarea id="description" maxlength="15000" rows="7"></textarea></label></section>
<section><h2>文字样式</h2><fieldset data-style="titleStyle"><legend>标题</legend></fieldset><fieldset data-style="bodyStyle"><legend>描述</legend></fieldset></section>
<section><h2>顶部封面</h2><p class="help">封面左右贴边；正文与媒体保持居中。</p><div id="cover-preview"></div><label class="upload-button">更换封面<input id="cover-file" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></label><button type="button" id="remove-cover">移除封面</button></section>
<section><h2>项目媒体</h2><p class="help">图片 / GIF / MP4 / WebM，单个文件不超过 50 MB。</p><label class="upload-button">添加图片、视频或 GIF<input id="media-files" type="file" multiple accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm"></label><div id="media-list"></div></section>
</form><section class="editor-canvas" aria-label="实时预览"><div class="preview-label">实时预览</div><div id="live-preview" class="project-detail"></div></section></main>
<script type="module" src="/editor.js"></script></body></html>
